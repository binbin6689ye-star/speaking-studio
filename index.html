<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaking Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f5fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speaking Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="tb-row">
    <h1>Speaking Studio</h1>
    <div class="stats"><span><b id="st-streak">0</b> day streak</span><span><b id="st-reps">0</b> today</span></div>
    <button class="icon-btn" id="open-settings" aria-label="Settings">⚙︎</button>
  </div>
  <label class="topic" for="topic"><span class="sr">Topic</span><select id="topic"></select></label>
</header>

<main>
  <div id="install-card" class="card install" hidden></div>
  <div id="model-card" class="card model" hidden></div>

  <!-- LISTEN -->
  <section id="tab-listen" class="view">
    <a href="#review" class="banner" id="rv-banner" hidden></a>
    <div class="card">
      <div class="meta"><span id="lis-pos"></span><span id="lis-topic"></span></div>
      <div class="row big">
        <button class="primary" id="lis-play">▶ Play</button>
        <button id="lis-slow">Slower</button>
        <button id="lis-next">Next ›</button>
      </div>
      <label for="lis-input" class="small">Type what you hear</label>
      <textarea id="lis-input" rows="3" placeholder="Type the sentence, then tap Check" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
      <button class="primary wide" id="lis-check">Check</button>
      <p class="status" id="lis-status"></p>
    </div>
    <div id="lis-result"></div>
  </section>

  <!-- REVIEW -->
  <section id="tab-review" class="view" hidden>
    <div class="card">
      <div class="meta"><span>Daily review</span><span id="rv-pos"></span></div>
      <p class="small" id="rv-day"></p>
      <p class="small" id="rv-empty" hidden></p>
      <div id="rv-card" hidden>
        <p class="zhbig" id="rv-zh"></p>
        <div class="row big">
          <button class="rec" id="rv-rec">● Say it in English</button>
          <button id="rv-show">Show answer</button>
        </div>
        <p class="plive" id="rv-live"></p>
        <label for="rv-text" class="small">Or type it</label>
        <input id="rv-text" type="text" placeholder="Type, then press Enter" autocapitalize="off" autocomplete="off" spellcheck="false">
        <div class="row"><button id="rv-prev">‹ Previous</button><button class="primary" id="rv-next">Next ›</button></div>
      </div>
      <div id="rv-summary" hidden></div>
      <button id="rv-today" class="wide" hidden>Practice today's sentences now</button>
    </div>
    <div id="rv-result"></div>
  </section>

  <!-- RECORDINGS -->
  <section id="tab-history" class="view" hidden>
    <div class="card">
      <div class="meta"><span>My weak words</span><span class="small" id="hi-count"></span></div>
      <p class="small">Words that didn't come through clearly. Tap one to practice it. ✓ = said perfectly at least once.</p>
      <div class="chips" id="hi-weak"></div>
    </div>
    <div class="card">
      <div class="row">
        <label for="hi-filter" class="small">Show</label>
        <select id="hi-filter">
          <option value="all">All recordings</option>
          <option value="sentence">Sentences</option>
          <option value="word">Words</option>
          <option value="review">Daily review</option>
        </select>
      </div>
      <ul class="hlist" id="hi-list"></ul>
    </div>
  </section>
</main>

<nav class="tabbar" aria-label="Sections">
  <a href="#listen" data-tab="listen"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="5" height="7" rx="2" fill="currentColor"/><rect x="16" y="14" width="5" height="7" rx="2" fill="currentColor"/></svg>Listen</a>
  <a href="#review" data-tab="review"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Review<span id="rv-badge" class="badge" hidden></span></a>
  <a href="#history" data-tab="history"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Recordings</a>
</nav>

<!-- Bottom sheets -->
<div id="sheet-bg" hidden></div>
<div class="sheet" id="word-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="ws-word"></div>
<div class="sheet" id="drill-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="dr-title"></div>
<div class="sheet" id="settings-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="set-title"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
