<!DOCTYPE html>
<html lang="yue-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>开口讲粤语</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#b8402a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="开口讲粤语">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="tb-row">
    <h1>开口讲粤语</h1>
    <div class="stats"><span><b id="st-streak">0</b> 日连续</span><span><b id="st-reps">0</b> 今日</span></div>
    <button class="icon-btn" id="open-settings" aria-label="设定">⚙︎</button>
  </div>
  <label class="topic" for="topic"><span class="sr">主题</span><select id="topic"></select></label>
</header>

<main>
  <div id="voice-card" class="card" hidden></div>
  <div id="install-card" class="card install" hidden></div>

  <!-- 练习 -->
  <section id="tab-practice" class="view">
    <a href="#review" class="banner" id="rv-banner" hidden></a>
    <div class="card" id="card"></div>
    <div class="card"><span class="lab">跟住讲</span>
      <p class="small">先听，再录低你自己讲一次，然后撳「对比」听下有咩唔同。</p>
      <div class="prac" id="prac"></div>
    </div>
  </section>

  <!-- 每日复习 -->
  <section id="tab-review" class="view" hidden>
    <div class="card">
      <div class="meta"><span>每日复习</span><span id="rv-pos"></span></div>
      <p class="small" id="rv-day"></p>
      <p class="small" id="rv-empty" hidden></p>
      <div id="rv-card" hidden>
        <p class="small">净系听，唔睇字。听完自己讲返出嚟，再揭晓答案。</p>
        <div class="row big"><button class="primary" id="rv-play">▶ 听</button><button id="rv-slow">慢啲</button></div>
        <div class="row big"><button class="rec" id="rv-rec">● 讲返出嚟</button><button id="rv-show">揭晓</button></div>
        <p class="plive" id="rv-live"></p>
        <div id="rv-answer"></div>
        <div id="rv-result"></div>
        <div class="row"><button id="rv-prev">‹ 上一句</button><button class="primary" id="rv-next">下一句 ›</button></div>
      </div>
      <div id="rv-summary" hidden></div>
      <button id="rv-today" class="wide" hidden>而家就复习今日讲过嘅句子</button>
    </div>
  </section>

  <!-- 我嘅录音 -->
  <section id="tab-history" class="view" hidden>
    <div class="card">
      <div class="meta"><span>我嘅录音</span><span class="small" id="hi-count"></span></div>
      <p class="small">每次录音都留低咗。撳「对比」会先播原声，再播你把声。</p>
      <ul class="hlist" id="hi-list"></ul>
    </div>
  </section>
</main>

<nav class="tabbar" aria-label="分类">
  <a href="#practice" data-tab="practice"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>练习</a>
  <a href="#review" data-tab="review"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>每日复习<span id="rv-badge" class="badge" hidden></span></a>
  <a href="#history" data-tab="history"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>我嘅录音</a>
</nav>

<div id="sheet-bg" hidden></div>
<div class="sheet" id="settings-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="set-title"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
